[package]
name = "layout-translator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
layout-translator-core = { path = "../crates/core" }  # everything that does the work
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio-util = { version = "0.7.12", default-features = false } # CancellationToken for the Stop button
serde = { version = "1", features = ["derive"] }
arboard = { version = "3.7", default-features = false, features = ["image-data"] } # reads the image on the clipboard for the paste button and Ctrl+V (MIT OR Apache-2.0)
