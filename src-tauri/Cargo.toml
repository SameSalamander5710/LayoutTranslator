[package]
name = "layout-translator"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", default-features = false, features = ["time"] } # waits between retries (already in the tree through reqwest and tauri; MIT)
tokio-util = { version = "0.7.12", default-features = false } # CancellationToken for the Stop button
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oar-ocr = "0.10"         # PaddleOCR via ONNX Runtime
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray"] }
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
base64 = "0.22"
futures-util = "0.3"       # runs several translation requests at once
unicode-linebreak = "0.1"  # where a line may break (Japanese, Chinese, ...)
unicode-segmentation = "1" # grapheme clusters, for cutting a word that is wider than the box
rayon = "1.12"            # erases and lays out the blocks of a page on all CPU cores
pdfium-render = "0.8"   # binds to a pdfium library shipped in resources/pdfium

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] } # async tests and a small mock server (MIT)

[profile.dev.package."*"]
opt-level = 3            # OCR is unusably slow at opt-level 0
