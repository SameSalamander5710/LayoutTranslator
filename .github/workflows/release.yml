# Builds the Windows and macOS installers AND portable ("standalone") zips.
#
# When it runs
# - Every push to master: builds everything and replaces the pre-release called "nightly" ("Latest build (master)")
#   with the new files. Pushes that only change *.md files are skipped.
# - A tag like v0.1.0 (git tag v0.1.0 && git push --tags): the same files go into a DRAFT release for that tag.
# - Manually (Actions > release > Run workflow): builds and keeps the files as workflow artifacts; on a branch other
#   than master nothing is published.
#
# The release is created by this workflow, so no release has to exist beforehand.
# Needs: Settings > Actions > General > Workflow permissions = "Read and write".
# Everything is UNSIGNED until you add signing secrets (see PLAN.md section 6).
name: release
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['**.md']   # not applied to tag pushes
  workflow_dispatch:

# A newer push to master replaces a build that is still running. Tag builds are never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            suffix: windows-x64
            target: ''
            args: '-- --locked'  # cargo must use Cargo.lock as it is, so a release cannot pick up newer crates
          - platform: macos-latest          # Apple Silicon
            suffix: macos-arm64
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin -- --locked'
          - platform: macos-15-intel        # Intel. GitHub retired macos-13 on 2025-12-04; this label lasts until the macOS 15 image is retired (Fall 2027)
            suffix: macos-x64
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin -- --locked'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci          # installs exactly what package-lock.json says

      # Third-party runtime files (pdfium, OCR models, fonts), pinned in scripts/models.json
      - run: npm run models

      # The installer (NSIS on Windows, dmg on macOS) and, on macOS, the .app.
      # Optional macOS signing/notarization: add the APPLE_* secrets as env here later.
      - run: npx tauri build ${{ matrix.args }}

      # Collect what is published into dist/. The portable (standalone) zip needs no installer:
      # Windows: the .exe plus the models, fonts and pdfium folders next to it (that is where the app looks for them).
      # macOS: the .app, which already contains its resources.
      - name: Collect installer and portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "LayoutTranslator_${version}_${{ matrix.suffix }}_portable"
          New-Item -ItemType Directory -Force dist, "stage/$name" | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/
          Copy-Item src-tauri/target/release/layout-translator.exe "stage/$name/Layout Translator.exe"
          foreach ($f in 'models', 'fonts', 'pdfium') { Copy-Item -Recurse "src-tauri/resources/$f" "stage/$name/$f" }
          Copy-Item packaging/portable-readme-windows.txt "stage/$name/README.txt"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Collect installer and portable zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          name="LayoutTranslator_${version}_${{ matrix.suffix }}_portable"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          cp "$bundle"/dmg/*.dmg dist/
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$app" || { echo "no .app found in $bundle/macos"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$name.zip"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  # One job publishes for all platforms, so the three builds never race to create the same release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: List files
        run: ls -l dist

      # Push to master: the "nightly" release is deleted (with its tag) and created again at this commit, so that it only
      # ever holds the files of the latest build, whatever their names.
      - name: Publish latest build (master)
        if: github.ref == 'refs/heads/master'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (master)" \
            --notes "Automatic, unsigned build of commit ${GITHUB_SHA::7} from master. Replaced by every push. Installers: the setup .exe (Windows) and the .dmg (macOS). Portable: the zip files with 'portable' in the name; unzip and run, nothing is installed. On Windows choose 'More info > Run anyway'. On macOS right-click the app > Open."

      # Tag: a draft release to review and publish by hand.
      - name: Publish draft release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease --verify-tag \
            --title "Layout Translator $GITHUB_REF_NAME" \
            --notes "Unsigned preview build. Installers: the setup .exe (Windows) and the .dmg (macOS). Portable: the zip files with 'portable' in the name; unzip and run. On Windows choose 'More info > Run anyway'. On macOS right-click the app > Open."
